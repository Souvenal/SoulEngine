name: CI

# Verify the project configures and builds on each supported hosted platform. Build verification only
# for this iteration; tests, artifacts, and further platforms are deliberate follow-ups.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev/feature]
  workflow_dispatch:

# A new push to a PR (or to main) cancels the still-running run of the previous HEAD.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            compiler: homebrew-llvm23
          - os: windows-latest
            compiler: llvm23
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate Homebrew download cache
        id: brew-cache
        if: matrix.os == 'macos-latest'
        run: echo "dir=$(brew --cache)" >> "$GITHUB_OUTPUT"

      # Caches downloaded bottles so the pinned LLVM bottle does not re-download every run. Bump v1 to
      # invalidate.
      - name: Cache Homebrew downloads
        if: matrix.os == 'macos-latest'
        uses: actions/cache@v4
        with:
          path: ${{ steps.brew-cache.outputs.dir }}
          key: brew-v1-${{ runner.os }}-${{ matrix.compiler }}

      # Select the required LLVM toolchain explicitly so xmake does not use the runner default compiler.
      - name: Install LLVM 23 on macOS
        if: matrix.os == 'macos-latest'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install llvm@23
          echo "$(brew --prefix llvm@23)/bin" >> "$GITHUB_PATH"

      - name: Install LLVM 23 on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          winget install --id LLVM.LLVM --version 23.1.0 --exact --accept-source-agreements --accept-package-agreements --silent
          $llvmBin = Join-Path ${env:ProgramFiles} 'LLVM\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin

      - name: Verify compiler
        shell: bash
        run: |
          command -v clang
          clang --version
          clang --version | grep -q 'clang version 23'

      # Package cache key hashes the project's xmake build files. Known limitation: a stale cache after
      # dependency changes is resolved by bumping the v1 component.
      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.1
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: xmake-${{ runner.os }}-${{ matrix.compiler }}-3.1.1
          package-cache: true
          package-cache-key: pkg-v2-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('xmake.lua', 'Engine/**/xmake.lua') }}

      # Required on fresh checkouts: the project's souvenal-repo clone lives under .xmake/ and xmake does not
      # re-clone it automatically; omitting it yields a misleading "package not found in any repository" error.
      - name: Sync package repositories
        run: xmake repo -u

      # -y: xmake asks before installing required packages, which hangs a non-interactive runner.
      - name: Configure
        run: xmake f -y -m release

      # Default targets only; test targets are excluded by set_default(false).
      - name: Build
        run: xmake -y
