name: CI

on:
  push:
    branches:
      - dev/ci
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          package-cache: true
          package-cache-key: soulengine-${{ runner.os }}
          project-path: .

      - name: Configure
        run: xmake f -m release

      - name: Build
        run: xmake

      - name: Test
        run: xmake test -v
