name: CI

# Verify the project configures and builds on each supported hosted platform. Build verification only
# for this iteration; tests, artifacts, and further platforms are deliberate follow-ups.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# A new push to a PR (or to main) cancels the still-running run of the previous HEAD.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Select PR builds when at least one changed path can affect the build: not Markdown, not under docs/ or
  # .agents/ (agent guidance and skill bundles), not TODO.md. Other events and detection failures select
  # full builds.
  changes:
    name: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      non_markdown: ${{ steps.filter.outputs.non_markdown || steps.overflow.outputs.non_markdown }}
    steps:
      - name: Detect non-Markdown changes
        id: filter
        if: github.event.pull_request.changed_files < 3000
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            non_markdown:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.agents/**'
              - '!TODO.md'

      # The PR file API caps results at 3,000 paths, so the boundary selects a full build.
      - name: Select full build at the API file limit
        id: overflow
        if: github.event.pull_request.changed_files >= 3000
        shell: bash
        run: echo "non_markdown=true" >> "$GITHUB_OUTPUT"

  build-macos:
    name: build-macos
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' ||
      needs.changes.outputs.non_markdown == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Locate Homebrew download cache
        id: brew-cache
        run: echo "dir=$(brew --cache)" >> "$GITHUB_OUTPUT"

      # Caches downloaded bottles so the pinned LLVM bottle does not re-download every run. Bump v1 to
      # invalidate.
      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.brew-cache.outputs.dir }}
          key: brew-v1-${{ runner.os }}-homebrew-llvm23

      # Select the required LLVM toolchain explicitly so xmake does not use the runner default compiler.
      - name: Install LLVM 23 on macOS
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install llvm@23
          echo "$(brew --prefix llvm@23)/bin" >> "$GITHUB_PATH"

      - name: Verify compiler
        shell: bash
        run: |
          command -v clang
          clang --version
          clang --version | grep -q 'clang version 23'

      # The action appends xmake's utils.ci.packageskey (hash of every required package's
      # name/version/buildhash) to this prefix, so dependency version changes invalidate the cache
      # automatically. Bump v2 when a package's content changes without a version change.
      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.1
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: xmake-${{ runner.os }}-homebrew-llvm23-3.1.1
          package-cache: true
          package-cache-key: pkg-v2-${{ runner.os }}-homebrew-llvm23
          build-cache: true
          build-cache-key: build-v1-${{ runner.os }}-homebrew-llvm23-xmake3.1.1-release

      # Required on fresh checkouts: the project's souvenal-repo clone lives under .xmake/ and xmake does not
      # re-clone it automatically; omitting it yields a misleading "package not found in any repository" error.
      - name: Sync package repositories
        run: xmake repo -u

      # -y: xmake asks before installing required packages, which hangs a non-interactive runner.
      - name: Configure
        run: xmake f -y -m release

      # Default targets only; test targets are excluded by set_default(false).
      - name: Build
        run: xmake -y

  build-windows:
    name: build-windows
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' ||
      needs.changes.outputs.non_markdown == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM 23 on Windows
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-23.1.3-win64.msi'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-win64.msi' -OutFile $installer
          Start-Process msiexec.exe -ArgumentList '/i', $installer, '/qn', '/norestart' -Wait
          $llvmBin = Join-Path ${env:ProgramFiles} 'LLVM\\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin

      - name: Verify compiler
        shell: bash
        run: |
          command -v clang
          clang --version
          clang --version | grep -q 'clang version 23'

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.1
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: xmake-${{ runner.os }}-llvm23-3.1.1
          package-cache: true
          package-cache-key: pkg-v2-${{ runner.os }}-llvm23
          build-cache: true
          build-cache-key: build-v1-${{ runner.os }}-llvm23-xmake3.1.1-release

      - name: Sync package repositories
        run: xmake repo -u

      - name: Configure
        run: xmake f -y -m release

      - name: Build
        run: xmake -y

  # Accept successful builds and expected Markdown-only skips; all other outcomes fail the stable repository gate.
  ci-result:
    name: ci-result
    needs: [changes, build-macos, build-windows]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Verify build results
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          NON_MARKDOWN: ${{ needs.changes.outputs.non_markdown }}
          MACOS_RESULT: ${{ needs['build-macos'].result }}
          WINDOWS_RESULT: ${{ needs['build-windows'].result }}
        run: |
          set -euo pipefail
          allowed_skip=false
          if [[ "$EVENT_NAME" == "pull_request" &&
                "$CHANGES_RESULT" == "success" &&
                "$NON_MARKDOWN" == "false" ]]; then
            allowed_skip=true
          fi

          check_result() {
            local name="$1"
            local result="$2"

            if [[ "$result" == "success" ]]; then
              return 0
            fi
            if [[ "$allowed_skip" == "true" && "$result" == "skipped" ]]; then
              return 0
            fi

            printf '%s: unexpected result %s\n' "$name" "$result" >&2
            return 1
          }

          check_result build-macos "$MACOS_RESULT"
          check_result build-windows "$WINDOWS_RESULT"
