repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        # files glob makes the .cppm coverage explicit rather than relying on identify's c++ mapping
        types_or: [file]
        files: \.(c|cc|cpp|cxx|cppm|h|hh|hpp|hxx)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-toml
      - id: check-yaml
      - id: check-json
        # Zed/VS Code settings are JSONC (allow comments), not strict JSON
        exclude: ^\.(zed|vscode)/
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: detect-private-key
  - repo: local
    hooks:
      - id: check-comments
        name: check-comments
        entry: python Tools/check_comments.py
        language: python
        pass_filenames: true
        files: ^(Engine/Source/.+\.(h|hpp|cpp|cppm)|Engine/Shaders/.+\.slang|Applications/[^/]+/Shaders/.+\.slang)$
