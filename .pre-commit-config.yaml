ci:
  autofix_prs: false
  autoupdate_branch: dev/feature
  autoupdate_schedule: weekly

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        # files glob makes the .cppm coverage explicit rather than relying on identify's c++ mapping
        types_or: [file]
        files: \.(c|cc|cpp|cxx|cppm|h|hh|hpp|hxx)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-json
        # Zed/VS Code settings are JSONC (allow comments), not strict JSON
        exclude: ^\.(zed|vscode)/
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: detect-private-key
      # Block commits directly on main/master; the maintainer's deliberate escape hatch is `git commit --no-verify`.
      - id: no-commit-to-branch
  - repo: local
    hooks:
      - id: check-comments
        name: check-comments
        entry: python Tools/check_comments.py
        language: python
        pass_filenames: true
        files: ^(Engine/Source/.+\.(h|hpp|cpp|cppm)|Engine/Shaders/.+\.slang|Applications/[^/]+/Shaders/.+\.slang)$
      - id: check-export-namespace
        name: check-export-namespace
        entry: python Tools/check_export_namespace.py
        language: python
        pass_filenames: true
        files: ^Engine/Source/.+\.(cpp|cppm)$
      - id: check-adr
        name: check-adr
        entry: python Tools/check_adr.py
        language: python
        pass_filenames: true
        files: ^docs/adr/[0-9]{2}-.*\.md$
