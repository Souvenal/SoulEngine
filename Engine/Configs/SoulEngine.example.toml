[Window]
ResolutionX = 1920
ResolutionY = 1080

[Render]
RHI = "Vulkan"
FramesInFlight = 2
# Renderer selected by applications that support the shared default.
# Supported values: "Raster", "RayTracing". When omitted: "Raster".
DefaultRenderer = "RayTracing"

[Log]
ConsoleLevel = "Info"
FileLevel    = "Debug"

[Application]
Name = "Test"

[Shader]
# Emit SPIR-V debug info (OpLine/OpString) for RenderDoc support.
# When omitted: debug builds default to true, release to false.
DebugInfo = true

[RHI.Vulkan]
# Per-frame dynamic constant arena capacity in bytes.
# Logical ConstantBuffer resources reserve aligned slots in this arena.
# When omitted the backend defaults to 4096 bytes.
ConstantArenaBufferSize = 4096
