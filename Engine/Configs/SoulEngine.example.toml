[Window]
ResolutionX = 1920
ResolutionY = 1080

[Render]
RHI = "Vulkan"
FramesInFlight = 2
# Renderer selected by applications that support the shared default.
# Supported values: "Raster", "RayTracing". When omitted: "Raster".
DefaultRenderer = "Raster"

[Log]
ConsoleLevel = "Info"
FileLevel    = "Debug"

[Application]
Name = "Sponza"

[Shader]
# Emit SPIR-V debug info (OpLine/OpString) for RenderDoc support.
# When omitted: debug builds default to true, release to false.
DebugInfo = true

[RHI.Vulkan]
# Enable VK_LAYER_KHRONOS_validation.
# When omitted, the Vulkan backend currently defaults to true.
Validation = true

# Enable VK_EXT_debug_utils and debug-message logging.
# When omitted, the Vulkan backend currently defaults to true.
DebugUtils = true

# Total transient uniform belt capacity in bytes.
# Logical ConstantBuffer resources reserve aligned ranges in this ring;
# the belt grows on demand and never shrinks.
# When omitted the backend defaults to 64 KiB.
UniformBeltSize = 65536

# Total transient shader-storage belt capacity in bytes.
# This stores geometry, material, light, and indirect-command data;
# the belt grows on demand and never shrinks.
# When omitted, the Vulkan backend defaults to 64 MiB.
ShaderStorageBeltSize = 67108864

# Initial acceleration-structure build scratch ring capacity in bytes.
# BLAS batches and TLAS builds carve scratch ranges out of this ring;
# it grows on demand and never shrinks.
# When omitted, the Vulkan backend defaults to 4 MiB.
ASScratchRingSize = 4194304

# Initial TLAS instance ring capacity in bytes.
# One AccelerationStructureInstanceKHR is 64 bytes; the ring grows on demand.
# When omitted, the Vulkan backend defaults to 64 KiB.
ASInstanceRingSize = 65536

# Bindless descriptor array size cap.
# When omitted, the Vulkan backend defaults to 4096.
MaxTextures = 4096
